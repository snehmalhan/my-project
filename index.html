<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.2.0/dist/chartjs-chart-matrix.min.js"></script>
</head>
<body>
  <h1>Analytics Dashboard</h1>
  <div class="dashboard">
    <div class="chart-container"><canvas id="alertsTimeChart"></canvas></div>
    <div class="chart-container"><canvas id="srcIpChart"></canvas></div>
    <div class="chart-container"><canvas id="dstIpChart"></canvas></div>
    <div class="chart-container"><canvas id="dstPortChart"></canvas></div>
    <div class="chart-container"><canvas id="flowChart"></canvas></div>
    <div class="chart-container"><canvas id="heatmapChart"  width="600" height="400"></canvas></div>
    <div class="chart-container"><canvas id="protocolChart" ></canvas></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
